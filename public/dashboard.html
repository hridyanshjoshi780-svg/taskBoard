<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard · My Boards</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Top Navigation -->
  <header class="app-topbar">
    <div class="brand-wrapper">
      <a class="brand-logo" href="/dashboard.html">
        <span class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <path d="M9 3v18" />
            <path d="M15 3v18" />
          </svg>
        </span>
        <span>TaskBoard</span>
      </a>
    </div>

    <nav class="topbar-nav">
      <div class="nav-user">
        <div class="user-avatar" id="user-avatar" title="Current User">?</div>
        <div class="user-details">
          <span class="user-name" id="user-name">Loading…</span>
          <span class="user-email" id="user-email"></span>
        </div>
      </div>
      <button id="logout-button" class="btn btn-secondary btn-sm" type="button" title="Sign out of TaskBoard">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" />
        </svg>
        <span>Sign Out</span>
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="dashboard-container">
    <section class="page-header">
      <div class="page-title-wrap">
        <span class="page-eyebrow">Workspace</span>
        <h1 class="page-title">My Boards</h1>
        <p class="page-desc">Create, manage, and collaborate across your team's project boards.</p>
      </div>

      <button id="open-create-board-btn" class="btn btn-primary" type="button">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        <span>Create Board</span>
      </button>
    </section>

    <!-- Page Alert Banner -->
    <div id="page-alert" class="form-alert form-alert-error hidden" role="alert">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
      </svg>
      <span id="page-alert-message"></span>
    </div>

    <!-- Boards Grid -->
    <section id="board-grid" class="board-grid" aria-live="polite">
      <!-- Loading skeletons -->
      <div class="board-card skeleton" style="min-height: 180px;"></div>
      <div class="board-card skeleton" style="min-height: 180px;"></div>
      <div class="board-card skeleton" style="min-height: 180px;"></div>
    </section>
  </main>

  <!-- Create Board Dialog / Modal -->
  <div id="create-board-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="create-board-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="create-board-title" class="modal-title">Create New Board</h2>
        <button type="button" class="btn-icon modal-close" id="close-create-modal" aria-label="Close dialog">
          <svg viewBox="0 0 20 20" fill="currentColor" style="width: 18px; height: 18px;">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>

      <form id="create-board-form" novalidate>
        <div class="modal-body">
          <div id="create-error-alert" class="form-alert form-alert-error hidden" role="alert">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
            <span id="create-error-message"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="board-name">
              Board name <span class="required">*</span>
            </label>
            <input
              id="board-name"
              name="name"
              type="text"
              class="form-control"
              required
              maxlength="100"
              placeholder="e.g. Sprint 24 or Marketing Redesign"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="board-desc">
              Description <span class="form-hint">(optional)</span>
            </label>
            <textarea
              id="board-desc"
              name="description"
              class="form-control"
              rows="3"
              maxlength="500"
              placeholder="What goals or projects will this board track?"
            ></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-create-board">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-create-board">Create Board</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Board Confirmation Modal -->
  <div id="delete-board-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="delete-board-title">
    <div class="modal-dialog" style="max-width: 440px;">
      <div class="modal-header">
        <h2 id="delete-board-title" class="modal-title">Delete Board</h2>
        <button type="button" class="btn-icon modal-close" id="close-delete-modal" aria-label="Close dialog">
          <svg viewBox="0 0 20 20" fill="currentColor" style="width: 18px; height: 18px;">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p style="color: var(--slate-600); line-height: 1.5;">
          Are you sure you want to delete <strong id="delete-board-name-display" style="color: var(--slate-900);">this board</strong>?
          This action will permanently delete all columns, tasks, and member associations.
        </p>
        <div id="delete-board-error" class="form-alert form-alert-error hidden" style="margin-top: 14px;" role="alert">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          <span id="delete-board-error-message"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancel-delete-board">Cancel</button>
        <button type="button" class="btn btn-danger-solid" id="confirm-delete-board">Delete Board</button>
      </div>
    </div>
  </div>

  <script src="/api.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
