<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard · Create Account</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <main class="auth-card">
      <div class="auth-header">
        <div class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <path d="M9 3v18" />
            <path d="M15 3v18" />
          </svg>
        </div>
        <p class="auth-eyebrow">Get Organized</p>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">A clearer way to move work forward together</p>
      </div>

      <div id="form-alert" class="form-alert form-alert-error hidden" role="alert">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <span id="form-alert-message"></span>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">
            Full name <span class="required">*</span>
          </label>
          <input
            id="name"
            name="name"
            type="text"
            class="form-control"
            required
            minlength="2"
            autocomplete="name"
            placeholder="Alex Morgan"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            Email address <span class="required">*</span>
          </label>
          <input
            id="email"
            name="email"
            type="email"
            class="form-control"
            required
            autocomplete="email"
            placeholder="alex@example.com"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            Password <span class="required">*</span>
          </label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-control"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="At least 8 characters"
          >
          <span class="form-hint">Must contain at least 8 characters</span>
        </div>

        <button id="register-submit" class="btn btn-primary" type="submit" style="width: 100%; margin-top: 8px;">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </main>
  </div>

  <script src="/api.js"></script>
  <script src="/register.js"></script>
</body>
</html>
